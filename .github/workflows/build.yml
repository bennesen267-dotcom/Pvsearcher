name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.8"

      - name: Zip'i ac
        run: unzip -q ./*.zip -d src_unzipped

      - name: Build
        working-directory: src_unzipped/pvsearch
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: pvsearch-jar
          path: src_unzipped/pvsearch/build/libs/*.jar
